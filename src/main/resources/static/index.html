<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学弹球闯关</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <header id="hud" class="hidden">
        <div class="hud-left">
            <span id="hud-level">LEVEL 1 / 9</span>
        </div>
        <div class="hud-mid">
            <span id="hud-ball">阶乘球 · 每击 +1 阶</span>
            <span id="hud-offline" class="badge hidden">离线配置</span>
        </div>
        <div class="hud-right">
            <span class="hud-label">尖刺</span>
            <div class="progress"><div id="hud-progress"></div></div>
        </div>
    </header>

    <div id="stage-wrap">
        <canvas id="stage" width="900" height="760"></canvas>

        <div id="intro" class="intro hidden"><span id="intro-text">LEVEL 1 / 9</span></div>

        <section id="home" class="overlay">
            <h1>数学弹球闯关</h1>
            <p class="subtitle">选一颗公式球，看它能不能在尖刺落到头顶之前砸穿三道屏障</p>
            <div id="ball-cards" class="cards"></div>
            <p class="hint">点击卡片开始挑战</p>
        </section>

        <section id="result" class="overlay hidden">
            <div class="result-card">
                <h2 id="result-title" class="over">GAME OVER</h2>
                <dl id="result-stats"></dl>
                <p class="hint">点击任意处返回主界面</p>
            </div>
        </section>

        <div id="alert" class="alert hidden"></div>
    </div>

    <aside id="debug" class="debug hidden"></aside>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
