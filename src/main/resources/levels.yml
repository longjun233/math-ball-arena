# 9 关数值表（唯一真值）
#
# 只写血量指数与尖刺速度；BigInteger 血量由 LevelService 现算。
#
# 血量曲线由 tools/design-levels.mjs 生成：
#   1. 小球阶数【跨关累加】，第 N 关从上一关结束时的 n 继续，不重置
#   2. 27 道屏障的血量指数【全局严格递增】，9 关是同一条成长曲线被切成 9 段
#   3. 第 27 道（第 9 关第 3 道）锁定 10^300
#
# 尖刺速度由 tools/calibrate.mjs 用真实物理逐帧模拟、二分搜索临界速度后反推。
# 改动任何物理参数或血量后，必须重跑：
#     node tools/design-levels.mjs
#     node tools/calibrate.mjs
#     node tools/physics-selftest.mjs
