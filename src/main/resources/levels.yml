# 9 关数值表（唯一真值）
#
# barriers 里写的是【血量表达式】，由 LevelService 在启动时实时解析成 BigInteger，
# 配置里不出现任何大整数，改数值只需改表达式：
#     "1" / "50"        —— 纯整数
#     "9.158e21"        —— 科学计数法（尾数可带小数）
#     "1e300"           —— 10^300
#
# 曲线由 tools/design-levels.mjs 生成：
#   · 第 1 关 = 1 / 50 / 100（亲和的小整数）
#   · 第 9 关第 3 道 = 10^300（硬约束）
#   · 中间由一条加速曲线贯通，关内倍数从 10^1.7 递增到 10^15.8
#   · 27 道屏障【全局严格递增】，9 关是同一条成长曲线被切成 9 段
#
# 尖刺速度由 tools/calibrate.mjs 用真实物理逐帧模拟标定。
mathball:
  levels:
    - level: 1
      barriers: ["1", "50", "100"]
      spike-speed: 18
    - level: 2
      barriers: ["6105000", "60770000000000", "9.158e21"]
      spike-speed: 20.5
    - level: 3
      barriers: ["1.035e31", "6.019e40", "1.418e51"]
      spike-speed: 23.1
    - level: 4
      barriers: ["1.142e62", "2.772e73", "1.836e85"]
      spike-speed: 25.6
    - level: 5
      barriers: ["3.065e97", "1.207e110", "1.061e123"]
      spike-speed: 28.1
    - level: 6
      barriers: ["1.984e136", "7.578e149", "5.701e163"]
      spike-speed: 30.6
    - level: 7
      barriers: ["8.182e177", "2.177e192", "1.047e207"]
      spike-speed: 33.2
    - level: 8
      barriers: ["8.885e221", "1.304e237", "3.243e252"]
      spike-speed: 35.7
    - level: 9
      barriers: ["1.344e268", "9.125e283", "1e300"]
      spike-speed: 38.2